<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Breast Cancer Awareness Camera</title>
<style>
:root{--pink:#f0407f;--bg:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Sarabun",sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
#box{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;max-height:100%;overflow:hidden;background:#fde9f1}
#box.fit{width:100%;height:auto}
video,#frame,#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transition:opacity .2s}
video.mirror{transform:scaleX(-1)}
#frame{pointer-events:none;object-fit:fill}
#shot{display:none;object-fit:fill}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px;font-size:15px;line-height:1.5;background:#000a;z-index:5}
#msg button{margin-top:12px}
#bar{height:calc(110px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:space-around;background:#111}
.round{width:52px;height:52px;border-radius:50%;border:0;background:#2a2a2a;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
#live{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;padding:0 16px}
.flipbtn{justify-self:end;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;background:#3a3a3c;color:#fff;font-size:17px;font-weight:600;padding:14px 20px;white-space:nowrap}
.flipbtn:active{opacity:.7}
#shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--pink);box-shadow:0 0 0 3px #111 inset}
#shutter:active{transform:scale(.93)}
.pill{border:0;border-radius:99px;padding:12px 18px;font-size:16px;font-weight:600;background:var(--pink);color:#fff}
.pill.ghost{background:#333}
#review{display:none;width:100%;align-items:center;justify-content:space-evenly;padding:0 8px}
#review .pill{padding:14px 26px;font-size:17px}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:86%}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
</style>
</head>

      <div id="flash"></div>
      <div id="msg"><div>แตะเพื่อเปิดกล้อง<br><button class="pill" id="start">เปิดกล้อง</button></div></div>
    </div>
  </div>
  <div id="bar">
    <div id="live">
      <span></span>
      <button id="shutter" aria-label="ถ่ายภาพ"></button>
      <button class="flipbtn" id="flip" aria-label="สลับกล้อง"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>สลับกล้อง</button>
    </div>
    <div id="review">
      <button class="pill ghost" id="retake">ถ่ายใหม่</button>
      <button class="pill" id="save">แชร์/บันทึกภาพ</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<canvas id="c" width="1080" height="1920" hidden></canvas>
<script>
const $=id=>document.getElementById(id);
const v=$('v'),frame=$('frame'),shot=$('shot'),msg=$('msg'),cv=$('c');
let facing='user',stream=null,blob=null;

function show(t,btn){msg.style.display='flex';msg.firstElementChild.innerHTML=t+(btn?'<br><button class="pill" id="start">ลองอีกครั้ง</button>':'');
  const s=$('start');if(s)s.onclick=startCam;}

async function open(vc){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:Object.assign({facingMode:{ideal:facing}},vc),audio:false});
  v.srcObject=stream;await v.play();
  if(!v.videoWidth)await new Promise(r=>v.addEventListener('loadedmetadata',r,{once:true}));
}
const TRIES=[{width:{ideal:1080},height:{ideal:1920}},{width:{ideal:1920},height:{ideal:1080}},{}];
const isPortrait=()=>v.videoHeight>=v.videoWidth||innerWidth>innerHeight;
function saved(){try{const n=localStorage.getItem('cam_'+facing);return n===null?null:+n;}catch(e){return null;}}
function save(n){try{localStorage.setItem('cam_'+facing,n);}catch(e){}}
function cover(txt){msg.style.display='flex';msg.style.background='#fde9f1';msg.style.color='#d63a73';msg.firstElementChild.innerHTML=txt;}

async function startCam(){
  cover('กำลังเปิดกล้อง...');
  try{
    let n=saved(),ok=false;
    // รอบถัดไป: ใช้ค่าที่เคยได้ผลเปิดครั้งเดียว ไม่กระพริบ
    if(n!==null){try{await open(TRIES[n]);ok=isPortrait();}catch(e){}}
    // ครั้งแรก: หาค่าที่ได้ภาพแนวตั้ง (ซ่อนไว้หลังหน้า "กำลังเปิดกล้อง")
    if(!ok){
      for(let i=0;i<TRIES.length;i++){
        try{await open(TRIES[i]);}catch(e){continue;}
        if(isPortrait()){save(i);ok=true;break;}
      }
    }
    if(!stream)throw 0;
    v.classList.toggle('mirror',facing==='user');
    msg.style.display='none';msg.style.background='';msg.style.color='';
  }catch(e){
    msg.style.background='';msg.style.color='';
    show('ไม่สามารถเข้าถึงกล้องได้<br>กรุณากด "อนุญาต" เมื่อเบราว์เซอร์ขอสิทธิ์ใช้กล้อง<br>หรือเปิดสิทธิ์กล้องในการตั้งค่าเบราว์เซอร์',true);
  }
}
$('start').onclick=startCam;
$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCam();};

function capture(){
  if(!v.videoWidth)return;
  const W=cv.width,H=cv.height,ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const vw=v.videoWidth,vh=v.videoHeight,tg=W/H;
  let sw=vw,sh=vh;
  if(vw/vh>tg)sw=vh*tg;else sh=vw/tg;
  const sx=(vw-sw)/2,sy=(vh-sh)/2;
  ctx.save();
  if(facing==='user'){ctx.translate(W,0);ctx.scale(-1,1);}
  ctx.drawImage(v,sx,sy,sw,sh,0,0,W,H);
  ctx.restore();
  ctx.drawImage(frame,0,0,W,H);
  const f=$('flash');f.style.transition='none';f.style.opacity=.8;
  requestAnimationFrame(()=>{f.style.transition='opacity .3s';f.style.opacity=0;});
  cv.toBlob(b=>{
    blob=b;shot.src=URL.createObjectURL(b);shot.style.display='block';
    $('live').style.display='none';$('review').style.display='flex';
  },'image/png');
}
$('shutter').onclick=capture;
$('retake').onclick=()=>{shot.style.display='none';$('review').style.display='none';$('live').style.display='grid';};

let tt;
function toast(m){const el=$('toast');el.textContent=m;el.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>el.style.opacity=0,2800);}
function mkFile(){return new File([blob],'breast-cancer-awareness-'+Date.now()+'.png',{type:'image/png'});}

$('save').onclick=async()=>{
  if(!blob)return;
  const file=mkFile();
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file]}); // เลือก "บันทึกรูปภาพ" หรือแอปที่ต้องการแชร์
      return;
    }
  }catch(e){if(e.name==='AbortError')return;}
  // อุปกรณ์ที่ไม่รองรับเมนูแชร์: ดาวน์โหลดไฟล์แทน
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();
  toast('บันทึกรูปเรียบร้อย');
};
</script>
</body>
